name: Matibatidos POS + Delivery 1.2.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar Matibatidos POS + Delivery
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer ZIP del proyecto, incluidos ZIP internos
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_ZIP="Matibatidos_POS_Delivery_1.2.2_LOGIN_CORREGIDO.zip"
          WORK="$GITHUB_WORKSPACE/_matibatidos_extracted"
          mkdir -p "$WORK"

          if [ ! -f "$GITHUB_WORKSPACE/$SOURCE_ZIP" ]; then
            echo "::error::No se encontró $SOURCE_ZIP en la raíz del repositorio."
            echo "Archivos disponibles:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          unzip -oq "$GITHUB_WORKSPACE/$SOURCE_ZIP" -d "$WORK"

          # El paquete entregado contiene el ZIP del proyecto Android dentro.
          INNER_ZIP="$WORK/Matibatidos_RC6_EXCEL_RENDIMIENTO_CORREGIDO.zip"
          if [ -f "$INNER_ZIP" ]; then
            mkdir -p "$WORK/android_project"
            unzip -oq "$INNER_ZIP" -d "$WORK/android_project"
          fi

          # Compatibilidad con futuras entregas que incluyan varios niveles ZIP.
          for level in 1 2 3; do
            mapfile -d '' ZIPS < <(
              find "$WORK" -type f -iname '*.zip' \
                ! -name "$SOURCE_ZIP" -print0
            )
            [ "${#ZIPS[@]}" -gt 0 ] || break
            for archive in "${ZIPS[@]}"; do
              case "$archive" in *.processed) continue ;; esac
              target="${archive%.*}_expanded"
              mkdir -p "$target"
              unzip -oq "$archive" -d "$target"
              mv "$archive" "$archive.processed"
            done
          done

          SETTINGS=""
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/app/build.gradle" ] || [ -f "$dir/app/build.gradle.kts" ]; then
              if [ -f "$dir/app/src/main/AndroidManifest.xml" ] &&
                 [ -f "$dir/app/src/main/assets/index.html" ]; then
                SETTINGS="$file"
                break
              fi
            fi
          done < <(
            find "$WORK" -type d \( -name .gradle -o -name build \) -prune -o \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0
          )

          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró la raíz válida del proyecto Android."
            find "$WORK" -maxdepth 7 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Proyecto localizado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar versión, paquete e identidad independiente
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/src/main/java/com/matibatidos/pos/rc6/MainActivity.java

          if [ -f app/build.gradle ]; then
            GRADLE_FILE="app/build.gradle"
          else
            GRADLE_FILE="app/build.gradle.kts"
          fi

          grep -Eq "applicationId[[:space:]]*['\"]com\.matibatidos\.pos\.rc6['\"]" "$GRADLE_FILE" || {
            echo "::error::applicationId no coincide; se cancela para proteger el POS de producción."
            exit 1
          }

          grep -q "versionCode 4" "$GRADLE_FILE" || {
            echo "::error::No se encontró versionCode 4."
            exit 1
          }

          grep -q "1.2.2-login-delivery" "$GRADLE_FILE" || {
            echo "::error::No se encontró la versión 1.2.2 esperada."
            exit 1
          }

          echo "Identificador y versión verificados."
          cat app/build.gradle

      - name: Preparar bibliotecas locales de Excel y gráficos
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS="app/src/main/assets"
          mkdir -p "$ASSETS"

          if [ ! -s "$ASSETS/xlsx.full.min.js" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" \
              --output "$ASSETS/xlsx.full.min.js"
          fi

          if [ ! -s "$ASSETS/chart.umd.min.js" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" \
              --output "$ASSETS/chart.umd.min.js"
          fi

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/chart.umd.min.js"
          ls -lh "$ASSETS/xlsx.full.min.js" "$ASSETS/chart.umd.min.js"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK no encontrado en $SDK."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager en el runner."
            find "$SDK" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --version
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Comprobar APK generada
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Gradle no generó una APK debug."
            find app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generada:"
          ls -lh "$APK"
          sha256sum "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-Delivery-1.2.2
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
